<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Явка группы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1418;
    --panel:#161F26;
    --panel-border:#25333C;
    --grid-line:#20292F;
    --text:#E8EDF0;
    --text-dim:#8CA0AA;
    --warn:#E8A33D;
    --ok:#4FD1C5;
    --critical:#E5533D;
    --warn-bg:rgba(232,163,61,0.10);
    --ok-bg:rgba(79,209,197,0.08);
    --critical-bg:rgba(229,83,61,0.14);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}

  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 24px;border-bottom:1px solid var(--panel-border);
    gap:12px;flex-wrap:wrap;
  }
  .nav{display:flex;align-items:center;gap:10px;}
  .navbtn{
    width:34px;height:34px;border-radius:8px;border:1px solid var(--panel-border);
    background:var(--panel);color:var(--text);font-size:16px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .navbtn:hover{border-color:var(--text-dim);}
  .weeklabel{font-size:15px;letter-spacing:.2px;}
  .weeklabel .sub{color:var(--text-dim);font-size:12.5px;margin-left:8px;}
  .week-info{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-top:6px;
  }

  .study-week{
    display:inline-flex;
    align-items:center;
    padding:5px 10px;
    border-radius:7px;
    background:rgba(74,222,128,.14);
    border:1px solid rgba(74,222,128,.45);
    color:#86efac;
    font-size:13px;
    font-weight:800;
    letter-spacing:.04em;
  }

  .week-type{
    color:var(--text-dim);
    font-size:12px;
  }
  .todaybtn{
    border:1px solid var(--panel-border);background:transparent;color:var(--text-dim);
    padding:7px 14px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit;
  }
  .todaybtn:hover{color:var(--text);border-color:var(--text-dim);}
  .legend{display:flex;gap:16px;font-size:12.5px;color:var(--text-dim);align-items:center;}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;}

  #status-banner{
    display:none;margin:16px 24px;padding:12px 16px;border-radius:8px;
    background:var(--warn-bg);border:1px solid var(--warn);color:var(--warn);
    font-size:13.5px;
  }

  .calwrap{padding:8px 24px 40px;overflow-x:auto;}
  .cal{min-width:820px;}
  .daynames{
    display:grid;grid-template-columns:56px repeat(7,1fr);
    border-bottom:1px solid var(--panel-border);
  }
  .daynames div{padding:10px 8px;font-size:13px;color:var(--text-dim);text-align:center;}
  .daynames div.today{color:var(--text);font-weight:600;}
  .daynames div span{display:block;font-size:11px;margin-top:2px;}

  .body-row{display:grid;grid-template-columns:56px repeat(7,1fr);}
  .gutter{position:relative;}
  .gutter span{
    position:absolute;left:0;right:6px;text-align:right;
    transform:translateY(-50%);font-size:11px;color:var(--text-dim);
  }
  .daycol{
    position:relative;border-left:1px solid var(--panel-border);
    background-image:repeating-linear-gradient(to bottom,var(--grid-line) 0,var(--grid-line) 1px,transparent 1px,transparent 60px);
  }
  .grid-height{height:840px;}

  .card{
    position:absolute;left:4px;right:4px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-left:3px solid var(--text-dim);
    border-radius:7px;padding:6px 8px;overflow:hidden;cursor:pointer;
    transition:transform .1s ease;
  }
  .card:hover{
  transform:translateY(-1px);
  border-color:var(--text-dim);
  }

  /* Низкая посещаемость — заметная оранжевая подсветка */
  .card.warn{
    background:
      linear-gradient(rgba(245, 158, 11, 0.28), rgba(245, 158, 11, 0.28)),
      var(--panel);
    border-left-color:#f59e0b;
    box-shadow:
      0 0 0 1px rgba(245,158,11,0.55) inset,
      0 0 12px rgba(245,158,11,0.12);
  }
  .card.ok{
    background:linear-gradient(var(--ok-bg),var(--ok-bg)),var(--panel);
  }

  /* Критически низкая посещаемость — яркая красная подсветка */
  .card.critical{
    background:
      linear-gradient(rgba(239, 68, 68, 0.32), rgba(239, 68, 68, 0.32)),
      var(--panel);
    border-left-color:#ef4444;
    box-shadow:
      0 0 0 1px rgba(239,68,68,0.7) inset,
      0 0 14px rgba(239,68,68,0.18);
  }

  /* Тип занятия — влияет на левую полоску */
  .card.lecture{
    border-left-color:#4ade80;
  }

  .card.seminar{
    border-left-color:#f472b6;
  }

  .card.lab{
    border-left-color:#7dd3fc;
  }
  .card .subj{font-size:12px;line-height:1.25;font-weight:500;color:var(--text);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .card .time{font-size:10.5px;color:var(--text-dim);margin-top:3px;}
  .card .count{font-size:11px;margin-top:3px;font-weight:500;}
  .card.warn .count{color:var(--warn);}
  .card.ok .count{color:var(--ok);}
  .card.critical .count{color:var(--critical);}

  .audience-toggle{display:flex;gap:4px;background:var(--panel);border:1px solid var(--panel-border);border-radius:8px;padding:3px;}
  .audience-toggle button{
    border:none;background:transparent;color:var(--text-dim);font-family:inherit;font-size:12.5px;
    padding:6px 12px;border-radius:6px;cursor:pointer;
  }
  .audience-toggle button.active{background:var(--panel-border);color:var(--text);}

  /* modal */
  .overlay{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);
    align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .modal{
    background:var(--panel);border:1px solid var(--panel-border);border-radius:12px;
    width:100%;max-width:420px;max-height:80vh;display:flex;flex-direction:column;
  }
  .modal-head{padding:18px 20px 12px;border-bottom:1px solid var(--panel-border);}
  .modal-head h3{margin:0 0 4px;font-size:16px;font-weight:600;}
  .modal-head .meta{font-size:12.5px;color:var(--text-dim);}
  .modal-list{overflow-y:auto;padding:6px 10px;flex:1;}
  .row{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 10px;border-radius:8px;cursor:pointer;
  }
  .row:hover{background:rgba(255,255,255,.03);}
  .row .name{font-size:13.5px;}
  .pill{
    font-size:11.5px;padding:4px 10px;border-radius:20px;font-family:'IBM Plex Mono',monospace;
    border:1px solid transparent;
  }
  .pill.present{
    color:var(--ok);
    background:var(--ok-bg);
    border-color:var(--ok);
  }

  .pill.absent{
    color:var(--warn);
    background:var(--warn-bg);
    border-color:var(--warn);
  }

  .pill.unset{
    color:var(--text-dim);
    background:rgba(140,160,170,0.08);
    border-color:var(--text-dim);
  }
  .modal-foot{
    padding:14px 20px;border-top:1px solid var(--panel-border);
    display:flex;align-items:center;justify-content:space-between;
  }
  .modal-foot .total{font-size:13px;color:var(--text-dim);}
  .modal-foot .total b{color:var(--text);font-family:'IBM Plex Mono',monospace;}
  .closebtn{
    border:1px solid var(--panel-border);background:transparent;color:var(--text);
    padding:8px 16px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:13px;
  }
  .closebtn:hover{border-color:var(--text-dim);}

  .empty-note{padding:40px 24px;color:var(--text-dim);font-size:13.5px;text-align:center;}

  .login-overlay{
  position:fixed;
  inset:0;
  background:var(--bg);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:100;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:360px;
  background:var(--panel);
  border:1px solid var(--panel-border);
  border-radius:12px;
  padding:24px;
}

.login-box h2{
  margin:0 0 20px;
  font-size:18px;
}

.login-box input{
  width:100%;
  padding:10px 12px;
  margin-bottom:12px;
  border:1px solid var(--panel-border);
  border-radius:8px;
  background:var(--bg);
  color:var(--text);
  font-family:inherit;
  outline:none;
  box-sizing:border-box;
}

.login-box input:focus{
  border-color:var(--text-dim);
}

.login-btn{
  width:100%;
  padding:10px;
  border:1px solid var(--panel-border);
  border-radius:8px;
  background:var(--panel-border);
  color:var(--text);
  font-family:inherit;
  cursor:pointer;
}

.login-btn:hover{
  border-color:var(--text-dim);
}

.login-error{
  display:none;
  color:var(--critical);
  font-size:13px;
  margin-bottom:12px;
}

.row.locked{
  cursor:default;
  opacity:.55;
}

.row.locked:hover{
  background:transparent;
}

</style>
</head>
<body>
  <div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <h2>Вход</h2>

    <div class="login-error" id="loginError"></div>

    <input
      type="text"
      id="loginUsername"
      placeholder="Логин"
      autocomplete="username"
    >

    <input
      type="password"
      id="loginPassword"
      placeholder="Пароль"
      autocomplete="current-password"
    >

    <button class="login-btn" id="loginBtn">Войти</button>
  </div>
</div>

<header>
  <div class="nav">
    <button class="navbtn" id="prevBtn">‹</button>
    <button class="navbtn" id="nextBtn">›</button>
    <div class="weeklabel mono" id="weekLabel">—</div>
  </div>
  <div class="legend">
    <span><span class="dot" style="background:var(--ok)"></span>достаточно людей</span>
    <span><span class="dot" style="background:var(--warn)"></span>нужно больше людей</span>
    <span><span class="dot" style="background:var(--critical)"></span>очень мало людей</span>
  </div>
  <div class="audience-toggle" id="audienceToggle">
    <button data-aud="calc" class="active">Расчётчики</button>
    <button data-aud="safety">Безопасники</button>
</div>
  <button class="todaybtn" id="todayBtn">Сегодня</button>
</header>

<div id="status-banner"></div>

<div class="calwrap">
  <div class="cal" id="cal">
    <div class="daynames" id="daynames"></div>
    <div class="body-row">
      <div class="gutter grid-height" id="gutter"></div>
      <div class="daycol grid-height" data-day="1"></div>
      <div class="daycol grid-height" data-day="2"></div>
      <div class="daycol grid-height" data-day="3"></div>
      <div class="daycol grid-height" data-day="4"></div>
      <div class="daycol grid-height" data-day="5"></div>
      <div class="daycol grid-height" data-day="6"></div>
      <div class="daycol grid-height" data-day="7"></div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalSubject">—</h3>
      <div class="meta" id="modalMeta">—</div>
    </div>
    <div class="modal-list" id="modalList"></div>
    <div class="modal-foot">
      <div class="total">Придут: <b id="modalCount">0/0</b></div>
      <button class="closebtn" id="closeBtn">Закрыть</button>
    </div>
  </div>
</div>

<script>
// ======= НАСТРОЙКА =======
// Вставь сюда URL своего развёрнутого Apps Script веб-приложения (после деплоя Code.gs)
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyY0cFois9_nnpgOYEqnb3pwudj9whjSK726hC0M7qYQW2DD8dz-6smjwB6DKEOECkA5A/exec";
// ==========================

const DAY_START = 7 * 60;   // 07:00 в минутах
const DAY_END = 21 * 60;    // 21:00 в минутах
const PX_PER_MIN = 1;
const DAY_NAMES = ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
// Начало отсчёта учебных недель:
// вторник 1 сентября 2026 года
const SEMESTER_START = new Date(2026, 8, 1);

let state = { students: [], schedule: [], presences: [], settings: {} };
let currentUser = null;
let currentMonday = getMonday(new Date());
let currentFilter = 'calc';

function audienceStudents(entry){
  if(entry.audience === 'military') return state.students.filter(s => s.military);
  if(entry.audience === 'calc') return state.students.filter(s => s.category === 'расчетчики');
  if(entry.audience === 'safety') return state.students.filter(s => s.category === 'безопасники');
  return state.students;
}

function pad(n){ return n < 10 ? "0"+n : ""+n; }
function isoDate(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function getMonday(d){
  const x = new Date(d);
  const day = (x.getDay() + 6) % 7;
  x.setDate(x.getDate() - day);
  x.setHours(0,0,0,0);
  return x;
}

function studyWeekNumber(monday){
  const startMonday = getMonday(SEMESTER_START);
  const diffMs = monday - startMonday;
  const diffWeeks = Math.round(diffMs / (7 * 86400000));

  return diffWeeks + 1;
}
function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function toMinutes(hhmm){ const [h,m] = hhmm.split(":").map(Number); return h*60+m; }

function weekTypeFor(monday){
  const ref = state.settings.reference_monday ? new Date(state.settings.reference_monday+"T00:00:00") : null;
  const refType = state.settings.reference_week_type || "A";
  if(!ref) return "A";
  const diffWeeks = Math.round((monday - getMonday(ref)) / (7*86400000));
  const other = refType === "A" ? "B" : "A";
  return (((diffWeeks % 2)+2) % 2 === 0) ? refType : other;
}
async function login(){
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;

  const error = document.getElementById('loginError');

  if(!username || !password){
    error.textContent = 'Введите логин и пароль';
    error.style.display = 'block';
    return;
  }

  try{
    const res = await fetch(APPS_SCRIPT_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({
        action:'login',
        username:username,
        password:password
      })
    });

    const data = await res.json();

    if(!data.ok){
      error.textContent = data.error || 'Не удалось войти';
      error.style.display = 'block';
      return;
    }

    currentUser = data.user;

    document.getElementById('loginOverlay').style.display = 'none';

    await loadData();

  }catch(err){
    error.textContent = 'Не удалось связаться с сервером';
    error.style.display = 'block';
  }
}



async function loadData(){
  if(!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf("ВСТАВЬ_СЮДА") === 0){
    showBanner("Бэкенд ещё не подключён: впиши APPS_SCRIPT_URL в начале файла (после деплоя Code.gs).");
    return;
  }
  try{
    // cache-busting: Google кэширует ответы веб-приложения по URL,
    // поэтому без уникального параметра все получали старые данные
    const url = APPS_SCRIPT_URL + (APPS_SCRIPT_URL.indexOf('?') >= 0 ? '&' : '?') + '_=' + Date.now();
    const res = await fetch(url, { cache: 'no-store' });
    const data = await res.json();
    state = data;
    hideBanner();
    render();
  }catch(err){
    showBanner("Не получилось загрузить данные. Проверь, что Apps Script развёрнут с доступом «Все» и URL указан верно.");
  }
}

document.getElementById('loginBtn').addEventListener('click', login);

document.getElementById('loginPassword').addEventListener('keydown', (e) => {
  if(e.key === 'Enter') login();
});


function showBanner(msg){
  const b = document.getElementById('status-banner');
  b.style.display = 'block';
  b.textContent = msg;
}
function hideBanner(){ document.getElementById('status-banner').style.display = 'none'; }

function buildGutter(){
  const g = document.getElementById('gutter');
  g.innerHTML = "";
  for(let h = 7; h <= 21; h++){
    const s = document.createElement('span');
    s.className = 'mono';
    s.style.top = ((h*60 - DAY_START) * PX_PER_MIN) + "px";
    s.textContent = pad(h) + ":00";
    g.appendChild(s);
  }
}

function render(){
  const weekType = weekTypeFor(currentMonday);
  const sunday = addDays(currentMonday, 6);

  const studyWeek = studyWeekNumber(currentMonday);

  const label =
    state.settings[weekType === "A" ? "week_a_label" : "week_b_label"]
    || ("Неделя " + weekType);

document.getElementById('weekLabel').innerHTML =
  fmtRange(currentMonday, sunday) +
  '<span class="sub week-info">' +
    '<span class="study-week">УЧЕБНАЯ НЕДЕЛЯ ' + studyWeek + '</span>' +
    '<span class="week-type">' + label + '</span>' +
  '</span>';

  const dn = document.getElementById('daynames');
  dn.innerHTML = "<div></div>";
  const todayIso = isoDate(new Date());
  for(let i=0;i<7;i++){
    const d = addDays(currentMonday, i);
    const div = document.createElement('div');
    if(isoDate(d) === todayIso) div.className = 'today';
    div.innerHTML = DAY_NAMES[i] + '<span>' + d.getDate() + '</span>';
    dn.appendChild(div);
  }

  buildGutter();

  const cols = document.querySelectorAll('.daycol');
  cols.forEach(c => c.innerHTML = "");

  const threshold = Number(state.settings.threshold_ratio || 0.6);
  const critical = Number(state.settings.critical_ratio || 0.35);

  state.schedule.forEach(entry => {
    if(entry.weekType !== 'both' && entry.weekType !== weekType) return;
    // фильтр "чьё расписание смотрим": свои пары другой категории скрываем,
    // общие (all) и военку показываем всегда
    if(currentFilter === 'calc' && entry.audience === 'safety') return;
    if(currentFilter === 'safety' && entry.audience === 'calc') return;

    const wd = Number(entry.weekday); // 1..7
    const dateObj = addDays(currentMonday, wd - 1);
    const dateIso = isoDate(dateObj);
    const startMin = toMinutes(entry.start);
    const endMin = toMinutes(entry.end);
    if(endMin <= DAY_START || startMin >= DAY_END) return;

    const aStudents = audienceStudents(entry);
    const total = aStudents.length;
    const entryPresences = state.presences.filter(p =>
      p.date === dateIso &&
      String(p.scheduleId) === String(entry.id) &&
      aStudents.some(s => s.name === p.student)
    );

    const presentList = entryPresences
      .filter(p => String(p.status || 'present') === 'present')
      .map(p => p.student);

    const present = presentList.length;

    const unset = aStudents.filter(s => {
      const p = state.presences.find(x =>
        x.date === dateIso &&
        String(x.scheduleId) === String(entry.id) &&
        x.student === s.name
      );

      return !p;
    }).length;

    const ratio = total > 0 ? present / total : 0;
    const status = ratio < critical ? 'critical' : (ratio < threshold ? 'warn' : 'ok');

    const typeClass = {
      lecture: 'lecture',
      seminar: 'seminar',
      lab: 'lab'
    }[String(entry.type || '').toLowerCase()] || 'lecture';

    const card = document.createElement('div');
    card.className = 'card ' + status + ' ' + typeClass;
    card.style.top = ((startMin - DAY_START) * PX_PER_MIN) + "px";
    card.style.height = Math.max(30, (endMin - startMin) * PX_PER_MIN - 2) + "px";

  card.innerHTML =
    '<div class="subj">' + entry.subject + '</div>' +
    '<div class="time mono">' + entry.start + '–' + entry.end + '</div>' +
    '<div class="count mono">' + present + '/' + total +
      (unset > 0 ? ' · ?' + unset : '') +
    '</div>';
  card.addEventListener('click', () => openModal(entry, dateIso, dateObj, presentList, aStudents));

    const col = document.querySelector('.daycol[data-day="'+wd+'"]');
    if(col) col.appendChild(card);
  });
}

function fmtRange(mon, sun){
  const months = ["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
  if(mon.getMonth() === sun.getMonth()){
    return mon.getDate() + " – " + sun.getDate() + " " + months[sun.getMonth()] + " " + sun.getFullYear();
  }
  return mon.getDate()+" "+months[mon.getMonth()]+" – "+sun.getDate()+" "+months[sun.getMonth()]+" "+sun.getFullYear();
}

function openModal(entry, dateIso, dateObj, presentList, aStudents)function openModal(entry, dateIso, dateObj, presentList, aStudents){
  const overlay = document.getElementById('overlay');

  document.getElementById('modalSubject').textContent = entry.subject;

  const weekdayFull = [
    "понедельник",
    "вторник",
    "среда",
    "четверг",
    "пятница",
    "суббота",
    "воскресенье"
  ][dateObj.getDay() === 0 ? 6 : dateObj.getDay() - 1];

  document.getElementById('modalMeta').textContent =
    weekdayFull.charAt(0).toUpperCase() +
    weekdayFull.slice(1) +
    ", " +
    dateObj.getDate() +
    " числа · " +
    entry.start +
    '–' +
    entry.end;

  const list = document.getElementById('modalList');
  list.innerHTML = "";

  function getStatus(name){
    const presence = state.presences.find(p =>
      p.date === dateIso &&
      String(p.scheduleId) === String(entry.id) &&
      p.student === name
    );

    if(!presence){
      return 'unset';
    }

    return String(presence.status || 'present');
  }

  function statusText(status){
    if(status === 'present') return 'придёт';
    if(status === 'absent') return 'не придёт';
    return 'не указал';
  }

  function refreshCount(){
    const present = aStudents.filter(s => {
      return getStatus(s.name) === 'present';
    }).length;

    document.getElementById('modalCount').textContent =
      present + "/" + aStudents.length;
  }

  aStudents.forEach(s => {
    const name = s.name;

    const canEdit =
      currentUser &&
      (
        currentUser.role === 'admin' ||
        currentUser.student === name
      );

    const row = document.createElement('div');
    row.className = 'row' + (canEdit ? '' : ' locked');

    const status = getStatus(name);

    row.innerHTML =
      '<span class="name">' + name + '</span>' +
      '<span class="pill ' + status + '">' +
        statusText(status) +
      '</span>';

    row.addEventListener('click', async () => {

      if(!canEdit) return;

      const oldStatus = getStatus(name);

      // Цикл:
      // Не указал → Придёт
      // Придёт → Не придёт
      // Не придёт → Придёт
      let newStatus;

      if(oldStatus === 'unset'){
        newStatus = 'present';
      }else if(oldStatus === 'present'){
        newStatus = 'absent';
      }else{
        newStatus = 'present';
      }

      // Оптимистично меняем локальное состояние
      state.presences = state.presences.filter(p =>
        !(
          p.date === dateIso &&
          String(p.scheduleId) === String(entry.id) &&
          p.student === name
        )
      );

      state.presences.push({
        date: dateIso,
        scheduleId: entry.id,
        student: name,
        status: newStatus
      });

      // Обновляем строку в модальном окне
      const pill = row.querySelector('.pill');
      pill.className = 'pill ' + newStatus;
      pill.textContent = statusText(newStatus);

      refreshCount();
      render();

      try{
        const res = await fetch(APPS_SCRIPT_URL, {
          method:'POST',
          headers:{
            'Content-Type':'text/plain;charset=utf-8'
          },
          body: JSON.stringify({
            action:'toggle',
            username:currentUser.username,
            date:dateIso,
            scheduleId:entry.id,
            student:name
          })
        });

        const data = await res.json();

        if(!data.ok){
          showBanner(
            data.error || "Не удалось сохранить отметку."
          );

          // Откатываем локальное состояние
          state.presences = state.presences.filter(p =>
            !(
              p.date === dateIso &&
              String(p.scheduleId) === String(entry.id) &&
              p.student === name
            )
          );

          if(oldStatus !== 'unset'){
            state.presences.push({
              date:dateIso,
              scheduleId:entry.id,
              student:name,
              status:oldStatus
            });
          }

          render();
          return;
        }

        // Сервер вернул фактический статус.
        // Используем его как окончательное значение.
        const serverStatus = String(data.status || newStatus);

        state.presences = state.presences.filter(p =>
          !(
            p.date === dateIso &&
            String(p.scheduleId) === String(entry.id) &&
            p.student === name
          )
        );

        state.presences.push({
          date:dateIso,
          scheduleId:entry.id,
          student:name,
          status:serverStatus
        });

        render();

      }catch(err){

        showBanner(
          "Не удалось сохранить отметку — проверь соединение и попробуй ещё раз."
        );

        // Откатываем состояние
        state.presences = state.presences.filter(p =>
          !(
            p.date === dateIso &&
            String(p.scheduleId) === String(entry.id) &&
            p.student === name
          )
        );

        if(oldStatus !== 'unset'){
          state.presences.push({
            date:dateIso,
            scheduleId:entry.id,
            student:name,
            status:oldStatus
          });
        }

        render();
      }
    });

    list.appendChild(row);
  });

  refreshCount();

  overlay.style.display = 'flex';
}

document.getElementById('closeBtn').addEventListener('click', () => {
  document.getElementById('overlay').style.display = 'none';
});
document.getElementById('overlay').addEventListener('click', (e) => {
  if(e.target.id === 'overlay') document.getElementById('overlay').style.display = 'none';
});
document.getElementById('prevBtn').addEventListener('click', () => { currentMonday = addDays(currentMonday, -7); render(); });
document.getElementById('nextBtn').addEventListener('click', () => { currentMonday = addDays(currentMonday, 7); render(); });
document.getElementById('todayBtn').addEventListener('click', () => { currentMonday = getMonday(new Date()); render(); });

document.getElementById('audienceToggle').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-aud]');
  if(!btn) return;
  currentFilter = btn.dataset.aud;
  document.querySelectorAll('#audienceToggle button').forEach(b => b.classList.toggle('active', b === btn));
  render();
});

</script>
</body>
</html>
